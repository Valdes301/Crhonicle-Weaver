version: '3.8'

services:
  tessitore-di-cronache:
    build:
      context: .
      dockerfile: Dockerfile
    image: tessitore-di-cronache-app:latest
    container_name: tessitore-di-cronache
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      # Persistenza del database SQLite e degli asset/upload
      - ./data:/app/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

